<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relax Boat Tour | Alanya Tour Organizations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #fff;
    }

    .tour-main {
      background: #07111f;
      color: #fff;
      overflow: hidden;
    }

    .tour-hero {
      position: relative;
      min-height: 640px;
      display: flex;
      align-items: flex-end;
      padding: 150px 7% 92px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .tour-hero__shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(7,17,31,.10), rgba(7,17,31,.96)),
        linear-gradient(90deg, rgba(7,17,31,.92), rgba(7,17,31,.30));
      z-index: 1;
    }

    .tour-hero__content {
      position: relative;
      z-index: 2;
      max-width: 760px;
    }

    .tour-kicker {
      display: inline-block;
      margin-bottom: 18px;
      color: #d6a24a;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .20em;
      text-transform: uppercase;
    }

    .tour-hero h1 {
      margin: 0 0 20px;
      font-size: clamp(44px, 6vw, 82px);
      line-height: .95;
      letter-spacing: -.04em;
    }

    .tour-hero p {
      margin: 0;
      max-width: 650px;
      font-size: 19px;
      line-height: 1.75;
      color: rgba(255,255,255,.82);
    }

    .tour-section {
      padding: 78px 7%;
    }

    .tour-container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    .tour-section-head {
      margin-bottom: 30px;
    }

    .tour-small-line {
      display: block;
      width: 58px;
      height: 2px;
      margin-bottom: 18px;
      background: linear-gradient(90deg, #d6a24a, rgba(214,162,74,0));
    }

    .tour-section h2 {
      margin: 0;
      font-size: clamp(28px, 3vw, 44px);
      line-height: 1.1;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .tour-text {
      max-width: 900px;
    }

    .tour-text p {
      margin: 0 0 18px;
      font-size: 17px;
      line-height: 1.9;
      color: rgba(255,255,255,.78);
    }

    .tour-details-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .tour-detail-card {
      min-height: 205px;
      padding: 28px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      border: 1px solid rgba(214,162,74,.34);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .tour-detail-icon {
      width: 46px;
      height: 46px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(214,162,74,.12);
      border: 1px solid rgba(214,162,74,.36);
      font-size: 21px;
    }

    .tour-detail-card h3 {
      margin: 0 0 12px;
      color: #d6a24a;
      font-size: 18px;
    }

    .tour-detail-card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255,255,255,.72);
    }

    .tour-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .tour-gallery-item {
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(214,162,74,.28);
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .tour-gallery img {
      width: 100%;
      height: 320px;
      display: block;
      object-fit: cover;
    }

    .tour-question {
      text-align: center;
      padding-bottom: 110px;
    }

    .tour-question h2 {
      margin-bottom: 16px;
    }

    .tour-question p {
      margin: 0 auto 28px;
      max-width: 620px;
      font-size: 17px;
      line-height: 1.75;
      color: rgba(255,255,255,.76);
    }

    .tour-whatsapp {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      padding: 0 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #d6a24a, #f2d27b);
      color: #07111f;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: .06em;
    }

    @media (max-width: 768px) {
      .tour-hero {
        min-height: 560px;
        padding: 120px 22px 58px;
      }

      .tour-hero h1 {
        font-size: 44px;
      }

      .tour-hero p {
        font-size: 16px;
        line-height: 1.65;
      }

      .tour-section {
        padding: 54px 22px;
      }

      .tour-details-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .tour-detail-card {
        min-height: auto;
        padding: 24px;
      }

      .tour-gallery {
        grid-template-columns: 1fr;
      }

      .tour-gallery img {
        height: 260px;
      }
    }
  </style>
</head>

<body class="tour-page relax-boat-page">

  <script>
    const TOUR = {
      pageClass: "relax-boat-page",

      category: "SEA EXPERIENCE",
      title: "Relax Boat Tour",
      subtitle: "A quiet and private sea escape in Alanya with hidden bays, calm atmosphere and no loud music.",

      hero: "images/relax-boat/hero.jpg",

      aboutTitle: "ABOUT THIS EXPERIENCE",
      aboutText: [
        "Relax Boat Tour is a completely different format of sea experience in Alanya.",
        "There is no loud music, no noisy animation and no party atmosphere. This tour is built around silence, calmness and real enjoyment of the Mediterranean Sea.",
        "The boat is small and usually welcomes only 10–15 guests, which creates a private, relaxed and peaceful atmosphere on board.",
        "The main feature of the route is hidden bays and quiet swimming spots where large pirate ships and standard tourist boats usually do not go.",
        "During the tour, guests can swim in clean water, sunbathe, rest in the shade, read a book or simply enjoy the silence of the sea."
      ],

      details: [
        {
          icon: "⏱️",
          title: "Tour Time",
          text: "Approx. 09:30 — 15:30"
        },
        {
          icon: "🎒",
          title: "What to Bring",
          text: "Swimwear, towel, sunglasses, sunscreen and a light cover-up."
        },
        {
          icon: "👨‍👩‍👧",
          title: "Child Policy",
          text: "Suitable for families, couples and guests who prefer a calm atmosphere."
        },
        {
          icon: "🚐",
          title: "Pickup Information",
          text: "Hotel pickup is available from Alanya region."
        }
      ],

      gallery: [
        "images/relax-boat/gallery-1.jpg",
        "images/relax-boat/gallery-2.jpg",
        "images/relax-boat/gallery-3.jpg"
      ],

      whatsappText: "Hello! I want to book Relax Boat Tour."
    };
  </script>

  <main id="tourRoot" class="tour-main"></main>

  <script>
    document.body.classList.add(TOUR.pageClass);

    document.getElementById("tourRoot").innerHTML = `
      <section class="tour-hero" style="background-image: url('${TOUR.hero}')">
        <div class="tour-hero__shade"></div>

        <div class="tour-hero__content">
          <span class="tour-kicker">${TOUR.category}</span>
          <h1>${TOUR.title}</h1>
          <p>${TOUR.subtitle}</p>
        </div>
      </section>

      <section class="tour-section tour-about">
        <div class="tour-container">
          <div class="tour-section-head">
            <span class="tour-small-line"></span>
            <h2>${TOUR.aboutTitle}</h2>
          </div>

          <div class="tour-text">
            ${TOUR.aboutText.map(p => <p>${p}</p>).join("")}
          </div>
        </div>
      </section>

      <section class="tour-section tour-details-section">
        <div class="tour-container">
          <div class="tour-details-grid">
            ${TOUR.details.map(item => `
              <article class="tour-detail-card">
                <div class="tour-detail-icon">${item.icon}</div>
                <h3>${item.title}</h3>
                <p>${item.text}</p>
              </article>
            `).join("")}
          </div>
        </div>
      </section>

      <section class="tour-section tour-gallery-section">
        <div class="tour-container">
          <div class="tour-section-head">
            <span class="tour-small-line"></span>
            <h2>PHOTO GALLERY</h2>
          </div>

          <div class="tour-gallery">
            ${TOUR.gallery.map(img => `
              <div class="tour-gallery-item">
                <img src="${img}" alt="${TOUR.title}">
              </div>
            `).join("")}
          </div>
        </div>
      </section>

      <section class="tour-section tour-question">
        <div class="tour-container">
          <h2>Have questions?</h2>
          <p>Write to us on WhatsApp and we will help you choose the best option.</p>

          <a 
            class="tour-whatsapp"
            href="https://wa.me/905387045999?text=${encodeURIComponent(TOUR.whatsappText)}"
          >
            BOOK ON WHATSAPP
          </a>
        </div>
      </section>
    `;
  </script>

</body>
</html>
