<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Electronic Gift Certificate | Alanya Tour Organizations</title>
<style>
:root{--navy:#031522;--panel:#082235;--gold:#e6b44d;--cream:#fff6df;--muted:#9fb1bc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#12354a 0,#061b2a 38%,#020c14 100%);color:#fff;font-family:Arial,sans-serif}.page{width:min(1120px,94vw);margin:auto;padding:32px 0 48px}.brand{text-align:center;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.24em}.brand strong{display:block;color:#fff;font:500 clamp(25px,4vw,46px) Georgia,serif;letter-spacing:.04em;margin:8px}.status{text-align:center;margin:18px auto 26px;color:var(--muted);font-size:12px;letter-spacing:.08em}.status b{color:var(--gold)}.card-wrap{position:relative;max-width:1050px;margin:auto;filter:drop-shadow(0 28px 55px rgba(0,0,0,.55))}.card-wrap img{display:block;width:100%;height:auto}.field{position:absolute;text-align:center;color:#071724;font-weight:900;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.value{left:4.8%;top:78.1%;width:20%;font-size:clamp(8px,1.22vw,18px)}.recipient{left:28.5%;top:78.1%;width:25%;font-size:clamp(7px,1.05vw,16px)}.valid{left:58.1%;top:78.1%;width:15%;font-size:clamp(7px,.95vw,14px)}.code{left:76.1%;top:78.1%;width:19%;font-size:clamp(6px,.8vw,12px);letter-spacing:.04em}.message{max-width:850px;margin:22px auto 0;text-align:center;color:#dce7ec;font:italic 16px/1.5 Georgia,serif}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px auto}.actions button,.actions a{border:1px solid rgba(230,180,77,.5);border-radius:999px;background:transparent;color:var(--cream);padding:12px 18px;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.08em;cursor:pointer}.actions .gold{background:linear-gradient(135deg,#f3ce75,#d99d32);color:#061522}.notice{max-width:720px;margin:10px auto;text-align:center;padding:15px;border:1px solid rgba(230,180,77,.25);border-radius:14px;background:rgba(8,34,53,.75);color:var(--muted);font-size:12px;line-height:1.55}.loading .card-wrap,.loading .message,.loading .actions{display:none}@media print{body{background:#fff}.page{width:100%;padding:0}.brand,.status,.message,.actions,.notice{display:none}.card-wrap{max-width:none;filter:none}}@media(max-width:600px){.page{width:98vw;padding-top:18px}.status{margin-bottom:15px}.message{font-size:13px;padding:0 16px}.actions{padding:0 12px}}
</style>
</head>
<body class="loading">
<script src="/assets/js/ato-mobile-header-loader.js?v=20260828-v41" data-ato-mobile-header-loader></script>
<main class="page">
  <div class="brand">ALANYA TOUR ORGANIZATIONS<strong>Electronic Gift Certificate</strong></div>
  <div class="status" id="status">Loading certificate…</div>
  <div class="card-wrap" aria-label="Alanya Tour electronic gift certificate">
    <img src="/assets/gift-certificate-template.png" alt="Alanya Tour Gift Card">
    <div class="field value" id="certValue"></div>
    <div class="field recipient" id="certRecipient"></div>
    <div class="field valid" id="certValid"></div>
    <div class="field code" id="certCode"></div>
  </div>
  <div class="message" id="certMessage"></div>
  <div class="actions"><button class="gold" id="printBtn">PRINT / SAVE PDF</button><button id="copyBtn">COPY CERTIFICATE CODE</button><a id="waBtn" href="#" target="_blank" rel="noopener">WHATSAPP</a></div>
  <div class="notice" id="notice">This electronic certificate becomes valid only after confirmation by Alanya Tour Organizations.</div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), status=$('status');
function config(){for(const c of [window.ATO_BOOKING_CONFIG,window.ATO_CONFIG,window.ATOBookingConfig,window.atoBookingConfig].filter(Boolean)){const url=c.supabaseUrl||c.supabaseURL||c.url||c.SUPABASE_URL||'';const key=c.supabaseAnonKey||c.supabaseKey||c.anonKey||c.publishableKey||c.supabasePublishableKey||c.SUPABASE_ANON_KEY||c.SUPABASE_PUBLISHABLE_KEY||'';if(/^https:\/\/.+\.supabase\.co\/?$/i.test(url)&&String(key).length>20)return{url:String(url).replace(/\/$/,''),key}}}
function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function getConfig(){let c=config();if(c)return c;for(const p of ['/booking-config.js','/interactive-map/booking-config.js','/assets/js/ato-config.js']){try{await load(p)}catch(_){}if((c=config()))return c}throw Error('Certificate service is temporarily unavailable.')}
function fmtDate(v){if(!v)return'PENDING';return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v+'T12:00:00'))}
function fail(msg){status.textContent=msg;document.body.classList.remove('loading');document.querySelector('.card-wrap').style.display='none';document.querySelector('.message').style.display='none';document.querySelector('.actions').style.display='none'}
async function init(){const token=new URLSearchParams(location.search).get('token');if(!token)return fail('Certificate link is incomplete.');try{const c=await getConfig();const res=await fetch(c.url+'/rest/v1/rpc/gift_certificate_public',{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});if(!res.ok)throw Error('Certificate was not found.');let data=await res.json();if(Array.isArray(data))data=data[0];if(!data||data.found===false)throw Error('Certificate was not found.');const active=data.status==='ACTIVE';const val=data.mode==='freedom'?'€'+Number(data.amountEur??data.amount_eur??0).toLocaleString('en',{maximumFractionDigits:2}):(data.experience||'SIGNATURE EXPERIENCE');const code=data.certificateCode||data.certificate_code||data.requestNo||data.request_no||'PENDING';$('certValue').textContent=val;$('certRecipient').textContent=data.recipientName||data.recipient_name||'';$('certValid').textContent=fmtDate(data.validUntil||data.valid_until);$('certCode').textContent=code;$('certMessage').textContent=data.personalMessage||data.personal_message||'';status.innerHTML=active?'STATUS: <b>ACTIVE</b>':'STATUS: <b>'+String(data.status||'REQUESTED')+'</b> — awaiting manager confirmation';$('notice').textContent=active?'Confirmed by Alanya Tour Organizations. Present the certificate code when booking.':'The request is registered in ATO Booking Manager. The certificate becomes active after manager confirmation.';$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(code);$('copyBtn').textContent='COPIED'};$('printBtn').onclick=()=>print();$('waBtn').href='https://wa.me/?text='+encodeURIComponent('Alanya Tour Gift Certificate '+code+' '+location.href);document.body.classList.remove('loading')}catch(e){fail(e.message||'Could not load certificate.')}}init();
})();
</script>
</body></html>
