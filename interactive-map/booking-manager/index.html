<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATO Booking Manager</title>
<script src="../booking-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#031522;--panel:#082131;--gold:#e2b33e;--line:rgba(226,179,62,.3);--text:#f5f7f8;--muted:#9fb0bc;--green:#158c70;--red:#b84c55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12384a 0,transparent 36%),var(--navy);color:var(--text);font:15px Arial,sans-serif}.shell{max-width:1320px;margin:auto;padding:22px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{color:var(--gold);font:700 25px Georgia,serif}.sub{color:var(--muted);font-size:12px}.panel{border:1px solid var(--line);border-radius:18px;background:rgba(5,27,41,.96);box-shadow:0 30px 80px #0008;padding:20px}.login{max-width:460px;margin:12vh auto}.field{display:grid;gap:7px;margin:14px 0}.field label{color:var(--gold);font-size:11px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #ffffff24;border-radius:10px;background:#061a29;color:#fff;padding:12px}.field textarea{min-height:90px}.btn{border:1px solid var(--gold);border-radius:10px;background:linear-gradient(100deg,#b57d0c,#f0ca5d);color:#06131d;font-weight:900;padding:12px 16px;cursor:pointer}.btn.secondary{background:#082131;color:#f3d77e}.btn.green{background:linear-gradient(100deg,#08705d,#18a482);color:white}.btn.red{border-color:#c85d65;background:#4a1720;color:white}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;background:#061a29;color:#fff;padding:10px}.grid{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:18px}.list{display:grid;gap:8px;max-height:74vh;overflow:auto}.item{border:1px solid #ffffff18;border-radius:12px;background:#061a29;padding:12px;cursor:pointer}.item.active{border-color:var(--gold)}.item-top{display:flex;justify-content:space-between;gap:8px}.status{border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.PENDING{background:#5b430d;color:#ffe19a}.CONFIRMED{background:#0c5d4e;color:#bfffea}.CANCELLED{background:#552029;color:#ffd1d5}.detail h2{margin:0 0 4px;color:var(--gold);font:700 24px Georgia,serif}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}.fact{border:1px solid #ffffff14;border-radius:10px;padding:10px}.fact b{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.tours{display:grid;gap:8px}.tour{border-left:3px solid var(--gold);background:#061a29;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.empty{padding:50px 12px;text-align:center;color:var(--muted)}.ticket{border:1px solid var(--gold);border-radius:14px;padding:18px;background:#fff;color:#101820}.ticket h2{color:#9b6800}.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ticket small{color:#5d6770}.notice{color:#ffd984;font-size:12px;line-height:1.5}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:38vh}.facts,.ticket-grid{grid-template-columns:1fr}.shell{padding:10px}}
@media print{body{background:#fff}.head,.toolbar,.list-pane,.actions,.manager-only{display:none!important}.shell,.panel{max-width:none;padding:0;border:0;box-shadow:none}.grid{display:block}.ticket{display:block!important}}
</style></head><body><main class="shell">
<section id="loginView" class="panel login"><div class="brand">ALANYA TOUR ORGANIZATIONS</div><h1>Booking Manager</h1><p class="sub">Закрытый вход для владельца</p><div class="field"><label>EMAIL</label><input id="email" type="email" value="leli_dars@mail.ru" autocomplete="email"></div><button class="btn" id="loginBtn">ПОЛУЧИТЬ ССЫЛКУ ДЛЯ ВХОДА</button><p id="loginStatus" class="notice"></p></section>
<section id="managerView" class="hidden"><header class="head"><div><div class="brand">ATO BOOKING MANAGER</div><div class="sub" id="ownerLabel"></div></div><button class="btn secondary" id="logoutBtn">ВЫЙТИ</button></header><div class="toolbar"><input id="search" placeholder="Поиск по имени, отелю, номеру"><select id="filter"><option value="ALL">ВСЕ</option><option>PENDING</option><option>CONFIRMED</option><option>CANCELLED</option></select><button class="btn secondary" id="refreshBtn">ОБНОВИТЬ</button></div><div class="grid"><section class="panel list-pane"><div class="list" id="bookingList"></div></section><section class="panel detail" id="detail"><div class="empty">Выберите заявку</div></section></div></section>
</main><script>
(async()=>{const cfg=window.ATO_BOOKING_CONFIG||{}, owner=(cfg.ownerEmail||'').toLowerCase();if(!cfg.supabaseUrl||String(cfg.supabaseUrl).startsWith('PASTE_')){document.getElementById('loginStatus').textContent='Сначала подключите Supabase в booking-config.js.';return}const db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);let rows=[],current=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sessionView(){const {data:{session}}=await db.auth.getSession();const email=session?.user?.email?.toLowerCase();if(!session||email!==owner){$('loginView').classList.remove('hidden');$('managerView').classList.add('hidden');if(session&&email!==owner){await db.auth.signOut();$('loginStatus').textContent='Для этого адреса доступ запрещён.'}return}$('loginView').classList.add('hidden');$('managerView').classList.remove('hidden');$('ownerLabel').textContent=email;load()}
async function load(){const {data,error}=await db.from('bookings').select('*').order('created_at',{ascending:false});if(error){$('bookingList').innerHTML=`<div class="notice">${esc(error.message)}</div>`;return}rows=data||[];renderList();if(current){current=rows.find(x=>x.id===current.id)||null;renderDetail()}}
function visible(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;return rows.filter(x=>(f==='ALL'||x.status===f)&&(!q||[x.request_number,x.client_name,x.hotel,x.client_whatsapp].join(' ').toLowerCase().includes(q)))}
function renderList(){$('bookingList').innerHTML=visible().map(x=>`<article class="item ${current?.id===x.id?'active':''}" data-id="${x.id}"><div class="item-top"><strong>${esc(x.request_number)}</strong><span class="status ${x.status}">${x.status}</span></div><p>${esc(x.client_name)} · ${esc(x.hotel)}</p><small>${new Date(x.created_at).toLocaleString()}</small></article>`).join('')||'<div class="empty">Заявок нет</div>'}
function tourHtml(t){return `<div class="tour"><strong>${esc(t.title)}</strong><div>${t.price==null?'Цена по запросу':'€'+esc(t.price)} · ${esc(t.preferred_date||'дата гибкая')}</div></div>`}
function renderDetail(){if(!current){$('detail').innerHTML='<div class="empty">Выберите заявку</div>';return}const x=current,tours=Array.isArray(x.selected_tours)?x.selected_tours:[];$('detail').innerHTML=`<div class="manager-only"><span class="status ${x.status}">${x.status}</span><h2>${esc(x.request_number)}</h2><div class="sub">${new Date(x.created_at).toLocaleString()}</div><div class="facts"><div class="fact"><b>КЛИЕНТ</b>${esc(x.client_name)}</div><div class="fact"><b>WHATSAPP</b>${esc(x.client_whatsapp)}</div><div class="fact"><b>ОТЕЛЬ</b>${esc(x.hotel)}</div><div class="fact"><b>ОТДЫХ</b>${esc(x.arrival_date||'—')} — ${esc(x.departure_date||'—')}</div><div class="fact"><b>ГОСТИ</b>${x.adults} взрослых · ${x.children} детей ${esc(x.child_ages||'')}</div><div class="fact"><b>ЯЗЫК / ТРАНСФЕР</b>${esc(x.language)} · ${esc(x.pickup)}</div></div><h3>Выбранные туры</h3><div class="tours">${tours.map(tourHtml).join('')}</div><div class="field"><label>ИТОГОВАЯ СУММА, €</label><input id="finalPrice" type="number" min="0" step="0.01" value="${esc(x.final_price||'')}"></div><div class="field"><label>ЗАМЕТКА МЕНЕДЖЕРА</label><textarea id="managerNotes">${esc(x.manager_notes||'')}</textarea></div><div class="actions"><button class="btn green" id="confirmBtn">ПОДТВЕРДИТЬ И СОЗДАТЬ БИЛЕТ</button><button class="btn red" id="cancelBtn">ОТМЕНИТЬ</button></div></div><section id="ticket" class="ticket ${x.status==='CONFIRMED'?'':'hidden'}"><small>ALANYA TOUR ORGANIZATIONS</small><h2>ЭЛЕКТРОННЫЙ БИЛЕТ</h2><div class="ticket-grid"><div><small>БИЛЕТ</small><br><b>${esc(x.ticket_number||x.request_number)}</b></div><div><small>КЛИЕНТ</small><br><b>${esc(x.client_name)}</b></div><div><small>ОТЕЛЬ</small><br>${esc(x.hotel)}</div><div><small>ГОСТИ</small><br>${x.adults} взрослых · ${x.children} детей</div></div><hr>${tours.map(tourHtml).join('')}<p><b>Итого: ${x.final_price==null?'подтверждается менеджером':'€'+esc(x.final_price)}</b></p><p>${esc(x.manager_notes||'')}</p></section><div class="actions ${x.status==='CONFIRMED'?'':'hidden'}"><button class="btn secondary" id="printBtn">ПЕЧАТЬ / PDF</button><button class="btn green" id="sendTicketBtn">ОТПРАВИТЬ БИЛЕТ В WHATSAPP</button></div>`;bindDetail()}
function bindDetail(){$('confirmBtn')?.addEventListener('click',async()=>{const number=current.ticket_number||`TKT-${Date.now().toString().slice(-8)}`,price=$('finalPrice').value||null,notes=$('managerNotes').value;const {error}=await db.from('bookings').update({status:'CONFIRMED',final_price:price,manager_notes:notes,confirmed_at:new Date().toISOString(),ticket_number:number,ticket_payload:{issued_at:new Date().toISOString()}}).eq('id',current.id);if(error)return alert(error.message);await load()});$('cancelBtn')?.addEventListener('click',async()=>{if(!confirm('Отменить заявку?'))return;const {error}=await db.from('bookings').update({status:'CANCELLED'}).eq('id',current.id);if(error)return alert(error.message);await load()});$('printBtn')?.addEventListener('click',()=>window.print());$('sendTicketBtn')?.addEventListener('click',()=>{const tours=(current.selected_tours||[]).map((t,i)=>`${i+1}. ${t.title} — ${t.preferred_date||'Flexible date'}`).join('\n');const msg=`ELECTRONIC TICKET — ALANYA TOUR ORGANIZATIONS\nTicket: ${current.ticket_number}\nClient: ${current.client_name}\nHotel: ${current.hotel}\nGuests: ${current.adults} adult(s), ${current.children} child(ren)\n\nTOURS\n${tours}\n\nTotal: ${current.final_price==null?'Confirmed by manager':'€'+current.final_price}\n${current.manager_notes||''}`;window.open(`https://wa.me/${String(current.client_whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank','noopener')})}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(email!==owner){$('loginStatus').textContent='Доступ разрешён только владельцу.';return}const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('loginStatus').textContent=error?error.message:'Ссылка для входа отправлена на почту.'};$('logoutBtn').onclick=async()=>{await db.auth.signOut();sessionView()};$('refreshBtn').onclick=load;$('search').oninput=renderList;$('filter').onchange=renderList;$('bookingList').onclick=e=>{const el=e.target.closest('[data-id]');if(!el)return;current=rows.find(x=>x.id===el.dataset.id);renderList();renderDetail()};db.auth.onAuthStateChange(()=>sessionView());sessionView()})();
</script></body></html>
