
<script id="ato-image-fallback-v20">
(function(){
  const fallback="../assets/images/tours/quad-safari-master.png";
  function protect(img){
    if(img.dataset.atoFallbackBound) return;
    img.dataset.atoFallbackBound='1';
    img.addEventListener('error',function(){
      if(this.getAttribute('src')!==fallback) this.setAttribute('src',fallback);
    });
  }
  document.querySelectorAll('img').forEach(protect);
  new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(n=>{
    if(n.nodeType!==1)return; if(n.matches&&n.matches('img'))protect(n); if(n.querySelectorAll)n.querySelectorAll('img').forEach(protect);
  }))).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
